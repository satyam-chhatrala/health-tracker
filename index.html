<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Tracker - Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;700;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-deep: #f3f4f6; 
            --bg-panel: #ffffff; 
            --border-heavy: #000000; 
            --border-light: #e5e7eb;
            --text-main: #111827; 
            --text-muted: #6b7280;
            --text-accent: #2563eb;
        }
        
        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        .title-font { font-family: 'Outfit', sans-serif; }
        
        /* Custom Checkbox Light Theme */
        .custom-chk { appearance: none; width: 20px; height: 20px; background-color: white; border: 2px solid black; cursor: pointer; display: grid; place-content: center; transition: all 0.1s;}
        .custom-chk::before { content: ""; width: 10px; height: 10px; transform: scale(0); background-color: white; clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); }
        .custom-chk:checked { background-color: black; }
        .custom-chk:checked::before { transform: scale(1); }

        ::-webkit-scrollbar { width: 6px; } 
        ::-webkit-scrollbar-thumb { background: var(--border-heavy); }
        ::-webkit-calendar-picker-indicator { cursor: pointer; } 

        .tab-active { border: 2px solid black; color: white; background-color: black; }
        .tab-inactive { color: #4b5563; border: 2px solid transparent; background-color: #e5e7eb; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center overflow-x-hidden">

<script>
    // ==========================================

        { id: 'f19', name: 'Thali - Matar Paneer, 3 Roti, Kali Dal', kcal: 600, p: 17, category: 'Weekend Orders' }, 
        { id: 'f21', name: 'Vada Pav', kcal: 170, p: 3, category: 'Weekend Orders' },

        { id: 'f30', name: 'Cookie Monster Sundae', kcal: 900, p: 6, category: 'Weekend Orders' }
    ];

    const WORKOUT_DB = {
        "Chest": ['Incline Bench', 'Flat Bench', 'Pec Fly Machine', 'Dumbbell Pec Fly', 'Push-ups', 'Low to High Cable Pull'],
        "Abs": ['Crunches', 'Leg Raises', 'Plank', 'Roller', 'Side Abs'],
        "Biceps": ['Bicep Curls', 'Hammer Curls', 'Preacher Curls', 'Incline Bench Curls'],
        "Triceps": ['Cable Pushdown', 'Overhead Extension', 'Dips', 'Skull Crushers', 'Single Hand Cable Pull'],
        "Back": ['Pull-ups', 'Barbell Rows', 'Lat Pulldown', 'Face Pulls'],
        "Shoulder": ['Overhead Press Machine', 'Lateral Raise Machine', 'Front Raises', 'Reverse Pec Fly', 'Military Press', 'Cable Face Pull'],
        "Leg": ['Squats', 'Leg Press', 'Calf Raises', 'Leg Extensions', 'Hamstring Curl', 'Lunges'],
        "Cardio": [] 
    };

    // Helper: Finds the most recently entered weight before or on the current date
    function getRecentWeight(targetDate) {
        if (storage[targetDate] && storage[targetDate].weight) return storage[targetDate].weight;
        const dates = Object.keys(storage).filter(k => k < targetDate).sort().reverse();
        for (let d of dates) {
            if (storage[d].weight) return storage[d].weight;
        }
        return ''; 
    }

    // Helper: Scans backward in database to find the last time this exercise was performed
    function getPreviousWorkoutData(exerciseName, targetDate) {
        const dates = Object.keys(storage).filter(k => k < targetDate).sort().reverse();
        for (let d of dates) {
            if (storage[d].sets) {
                if (storage[d].sets[`${exerciseName}-s1`] || storage[d].sets[`${exerciseName}-s2`] || storage[d].sets[`${exerciseName}-s3`]) {
                    return {
                        s1: storage[d].sets[`${exerciseName}-s1`] || '',
                        s2: storage[d].sets[`${exerciseName}-s2`] || '',
                        s3: storage[d].sets[`${exerciseName}-s3`] || ''
                    };
                }
            }
        }
        return { s1: '', s2: '', s3: '' };
    }

    // Dynamic color coding for workout inputs based on previous performance
    function colorCodeInput(inputElem) {
        const val = parseFloat(inputElem.value);
        const prevStr = inputElem.getAttribute('data-prev');
        
        inputElem.classList.remove('bg-gray-50', 'bg-red-200', 'bg-yellow-200', 'bg-green-200');
        
        if (!prevStr || isNaN(val)) {
            inputElem.classList.add('bg-gray-50'); 
            return;
        }
        
        const prev = parseFloat(prevStr);
        if (isNaN(prev)) {
            inputElem.classList.add('bg-gray-50');
            return;
        }

        if (val < prev) inputElem.classList.add('bg-red-200');
        else if (val === prev) inputElem.classList.add('bg-yellow-200');
        else inputElem.classList.add('bg-green-200');
    }

    // INIT: Fetches database state on load
    async function init() {
        const selector = document.getElementById('analytics-exercise-selector');
        Object.keys(WORKOUT_DB).forEach(split => {
            if(split !== 'Cardio') {
                WORKOUT_DB[split].forEach(ex => {
                    const opt = document.createElement('option');
                    opt.value = ex; opt.innerText = ex;
                    selector.appendChild(opt);
                });
            }
        });

        // Set default dates
        const today = new Date();
        const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        
        const lastWeek = new Date(today);
        lastWeek.setDate(lastWeek.getDate() - 13); // Default 14 day view inclusive
        const lastWeekStr = `${lastWeek.getFullYear()}-${String(lastWeek.getMonth() + 1).padStart(2, '0')}-${String(lastWeek.getDate()).padStart(2, '0')}`;

        document.getElementById('date-picker').value = todayStr;
        document.getElementById('analytics-start').value = lastWeekStr;
        document.getElementById('analytics-end').value = todayStr;

        document.getElementById('date-picker').onchange = (e) => {
            loadData(e.target.value);
        };

        try {
            const response = await fetch(`${API_URL}/logs`);
            if (response.ok) {
                storage = await response.json();
                document.getElementById('db-status-badge').innerText = "Connected";
                document.getElementById('db-status-badge').className = "mono-font text-[10px] font-black uppercase tracking-widest text-green-600";
            } else {
                throw new Error("API responded but not OK");
            }
        } catch (err) {
            console.warn("Could not reach DB API. Operating in memory-only mode.", err);
            document.getElementById('db-status-badge').innerText = "Offline";
            document.getElementById('db-status-badge').className = "mono-font text-[10px] font-black uppercase tracking-widest text-red-600";
        }

        loadData(todayStr);
    }

    // RENDER CATEGORIZED FOODS
    function renderFoods(savedFoods = []) {
        const categories = ['Breakfast', 'Lunch', 'Snacks', 'Dinner', 'Extra', 'Weekend Orders'];
        let html = '';

        categories.forEach(cat => {
            const foodsInCat = FOOD_DB.filter(f => f.category === cat);
            if(foodsInCat.length === 0) return;

            html += `
                <div class="mb-5 first:mt-0">
                    <h3 class="text-[10px] font-black tracking-widest text-black uppercase sticky top-0 py-2 border-b-2 border-t-2 border-black z-10 px-2 -mx-2 bg-white/40 backdrop-blur-md">${cat}</h3>
                    <div class="flex flex-col mt-2">
            `;

            html += foodsInCat.map(f => `
                <label class="flex items-center gap-4 py-2.5 border-b border-black/10 cursor-pointer hover:bg-black/5 transition-colors rounded px-2 -mx-2">
                    <input type="checkbox" id="chk-${f.id}" class="custom-chk flex-shrink-0" ${savedFoods.includes(f.id) ? 'checked' : ''} onchange="autoSave()">
                    <div class="flex-grow flex justify-between items-center text-sm">
                        <span class="font-bold text-gray-900">${f.name}</span>
                        <span class="mono-font text-xs text-gray-700">${f.kcal} <span class="text-[10px]">kcal</span> <span class="mx-1 text-black">|</span> <span class="text-black font-bold">${f.p}g</span></span>
                    </div>
                </label>
            `).join('');

            html += `</div></div>`;
        });

        document.getElementById('food-list').innerHTML = html;
    }

    function renderExercises() {
        const split = document.getElementById('split-selector').value;
        const date = document.getElementById('date-picker').value;
        const dayData = storage[date] || { sets: {}, cardio: {} };

        if (split === 'Cardio') {
            document.getElementById('exercise-list').innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-gray-200 pb-4 gap-3 sm:gap-0">
                    <span class="mono-font text-sm font-bold text-black w-full sm:w-1/4">Treadmill/Mix</span>
                    <div class="grid grid-cols-4 gap-2 w-full sm:w-3/4 sm:flex sm:justify-end">
                        <input type="number" id="cardio-incline" placeholder="Inc" class="w-full sm:w-16 h-8 bg-gray-50 border-2 border-black text-center text-black text-sm mono-font placeholder-gray-400 focus:outline-none focus:border-blue-600 transition-colors" value="${dayData.cardio?.incline || ''}" oninput="autoSave()">
                        <input type="number" id="cardio-speed" placeholder="Spd" class="w-full sm:w-16 h-8 bg-gray-50 border-2 border-black text-center text-black text-sm mono-font placeholder-gray-400 focus:outline-none focus:border-blue-600 transition-colors" value="${dayData.cardio?.speed || ''}" oninput="autoSave()">
                        <input type="number" id="cardio-minutes" placeholder="Mins" class="w-full sm:w-16 h-8 bg-gray-50 border-2 border-black text-center text-black text-sm mono-font placeholder-gray-400 focus:outline-none focus:border-blue-600 transition-colors" value="${dayData.cardio?.minutes || ''}" oninput="autoSave()">
                        <input type="number" id="cardio-kcal" placeholder="Kcal" class="w-full sm:w-16 h-8 bg-gray-50 border-2 border-black text-center text-black text-sm mono-font placeholder-gray-400 focus:outline-none focus:border-blue-600 transition-colors" value="${dayData.cardio?.kcal || ''}" oninput="autoSave()">
                    </div>
                </div>
            `;
        } else {
            const exercises = WORKOUT_DB[split];
            document.getElementById('exercise-list').innerHTML = exercises.map(ex => {
                const prevSets = getPreviousWorkoutData(ex, date);
                
                return `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end border-b border-gray-200 pb-4 gap-3 sm:gap-0">
                    <span class="mono-font text-sm font-bold text-black truncate pr-2 w-full sm:w-auto pb-1">${ex}</span>
                    <div class="flex gap-2 w-full sm:w-auto sm:gap-4">
                        <div class="flex flex-col flex-1 sm:w-16">
                            <span class="text-[9px] text-gray-500 text-center font-bold mono-font mb-1 truncate">${prevSets.s1 ? `Last: ${prevSets.s1}` : '&nbsp;'}</span>
                            <input type="text" id="${ex}-s1" data-prev="${prevSets.s1}" placeholder="S1" class="set-input w-full h-8 bg-gray-50 border-2 border-black text-center text-black text-sm mono-font placeholder-gray-400 focus:outline-none focus:border-blue-600 transition-colors" value="${dayData.sets[`${ex}-s1`] || ''}" oninput="colorCodeInput(this); autoSave()">
                        </div>
                        <div class="flex flex-col flex-1 sm:w-16">
                            <span class="text-[9px] text-gray-500 text-center font-bold mono-font mb-1 truncate">${prevSets.s2 ? `Last: ${prevSets.s2}` : '&nbsp;'}</span>
                            <input type="text" id="${ex}-s2" data-prev="${prevSets.s2}" placeholder="S2" class="set-input w-full h-8 bg-gray-50 border-2 border-black text-center text-black text-sm mono-font placeholder-gray-400 focus:outline-none focus:border-blue-600 transition-colors" value="${dayData.sets[`${ex}-s2`] || ''}" oninput="colorCodeInput(this); autoSave()">
                        </div>
                        <div class="flex flex-col flex-1 sm:w-16">
                            <span class="text-[9px] text-gray-500 text-center font-bold mono-font mb-1 truncate">${prevSets.s3 ? `Last: ${prevSets.s3}` : '&nbsp;'}</span>
                            <input type="text" id="${ex}-s3" data-prev="${prevSets.s3}" placeholder="S3" class="set-input w-full h-8 bg-gray-50 border-2 border-black text-center text-black text-sm mono-font placeholder-gray-400 focus:outline-none focus:border-blue-600 transition-colors" value="${dayData.sets[`${ex}-s3`] || ''}" oninput="colorCodeInput(this); autoSave()">
                        </div>
                    </div>
                </div>
            `}).join('');
            
            // Apply colors on render
            document.querySelectorAll('.set-input').forEach(input => colorCodeInput(input));
        }
        updateMetrics(); 
    }

    // AUTOSAVE: Updates local memory instantly, then triggers a debounced cloud sync
    function autoSave() {
        const date = document.getElementById('date-picker').value;
        const split = document.getElementById('split-selector').value;
        const existingData = storage[date] || { sets: {}, cardio: {} };
        
        const selectedFoods = FOOD_DB.filter(f => document.getElementById(`chk-${f.id}`)?.checked).map(f => f.id);
        const weight = document.getElementById('weight-in').value;
        const water = document.getElementById('water-in').value;
        const steps = document.getElementById('steps-in').value;
        const junkKcal = document.getElementById('junk-kcal').value;
        const junkProtein = document.getElementById('junk-protein').value;

        const sets = {};
        if (split !== 'Cardio') {
            WORKOUT_DB[split].forEach(ex => {
                sets[`${ex}-s1`] = document.getElementById(`${ex}-s1`)?.value || '';
                sets[`${ex}-s2`] = document.getElementById(`${ex}-s2`)?.value || '';
                sets[`${ex}-s3`] = document.getElementById(`${ex}-s3`)?.value || '';
            });
        }
        const updatedSets = { ...existingData.sets, ...sets };

        const cardio = {
            incline: document.getElementById('cardio-incline') ? document.getElementById('cardio-incline').value : existingData.cardio?.incline || '',
            speed: document.getElementById('cardio-speed') ? document.getElementById('cardio-speed').value : existingData.cardio?.speed || '',
            minutes: document.getElementById('cardio-minutes') ? document.getElementById('cardio-minutes').value : existingData.cardio?.minutes || '',
            kcal: document.getElementById('cardio-kcal') ? document.getElementById('cardio-kcal').value : existingData.cardio?.kcal || ''
        };

        storage[date] = { split, foods: selectedFoods, sets: updatedSets, weight, water, steps, junkKcal, junkProtein, cardio };
        updateMetrics();

        clearTimeout(syncTimeout); 
        
        const badge = document.getElementById('db-status-badge');
        if(badge) {
            badge.innerText = "Syncing...";
            badge.className = "mono-font text-[10px] font-black uppercase tracking-widest text-yellow-600";
        }

        syncTimeout = setTimeout(() => {
            synchronizeData();
        }, 1500);
    }

    // SYNC: Pushes data silently in the background
    async function synchronizeData() {
        const date = document.getElementById('date-picker').value;
        const badge = document.getElementById('db-status-badge');
        
        try {
            const response = await fetch(`${API_URL}/log`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ date: date, data: storage[date] })
            });

            if (response.ok) {
                if(badge) {
                    badge.innerText = 'Connected';
                    badge.className = 'mono-font text-[10px] font-black uppercase tracking-widest text-green-600';
                }
            } else {
                throw new Error('Sync returned non-200 status');
            }
        } catch (error) {
            console.error("Auto-sync failed:", error);
            if(badge) {
                badge.innerText = 'Sync Failed';
                badge.className = 'mono-font text-[10px] font-black uppercase tracking-widest text-red-600';
            }
        }
    }

    function updateMetrics() {
        const date = document.getElementById('date-picker').value;
        const currentData = storage[date] || { sets: {}, cardio: {} };

        let totalKcal = parseInt(document.getElementById('junk-kcal').value) || 0;
        let totalProtein = parseInt(document.getElementById('junk-protein').value) || 0;
        
        FOOD_DB.forEach(f => {
            if(document.getElementById(`chk-${f.id}`)?.checked) {
                totalKcal += f.kcal;
                totalProtein += f.p;
            }
        });

        // Update Nutrition Panel Background based on Protein
        const nutritionPanel = document.getElementById('nutrition-panel');
        nutritionPanel.classList.remove('bg-white', 'bg-red-100', 'bg-yellow-100', 'bg-green-100');
        
        if (totalProtein === 0) {
            nutritionPanel.classList.add('bg-white');
        } else if (totalProtein < 70) {
            nutritionPanel.classList.add('bg-red-100');
        } else if (totalProtein < 90) {
            nutritionPanel.classList.add('bg-yellow-100');
        } else {
            nutritionPanel.classList.add('bg-green-100');
        }

        document.getElementById('metrics-log').innerHTML = `
            <div class="flex flex-row justify-between items-center h-full">
                <div>
                    <p class="mono-font text-[10px] font-bold tracking-[0.1em] text-green-700 uppercase mb-1">&gt;&nbsp;KCAL_IN</p>
                    <p class="text-xl md:text-2xl font-black mono-font text-black">${totalKcal} <span class="text-[10px] md:text-xs text-gray-500">kcal</span></p>
                </div>
                <div class="text-right">
                    <p class="mono-font text-[10px] font-bold tracking-[0.1em] text-blue-700 uppercase mb-1">PRO_IN&nbsp;&lt;</p>
                    <p class="text-xl md:text-2xl font-black mono-font text-black">${totalProtein} <span class="text-[10px] md:text-xs text-gray-500">g</span></p>
                </div>
            </div>
        `;

        let workoutActive = false;
        if(currentData.sets) workoutActive = Object.values(currentData.sets).some(val => val !== '');
        
        let cardioBurn = parseInt(currentData.cardio?.kcal) || 0;
        let stepsCount = parseInt(document.getElementById('steps-in').value) || 0;
        let stepBurn = stepsCount * 0.04; 

        // Dynamic BMR Calculation via Mifflin-St Jeor Equation
        let currentWeight = parseFloat(document.getElementById('weight-in').value);
        if (isNaN(currentWeight) || currentWeight === 0) currentWeight = 67; 
        
        const bmr = Math.round((10 * currentWeight) + (6.25 * USER_HEIGHT_CM) - (5 * USER_AGE) + 5);
        const caloriesOut = Math.round(bmr + (workoutActive ? 350 : 0) + cardioBurn + stepBurn);

        document.getElementById('activity-log').innerHTML = `
            <div class="flex flex-row justify-between items-center h-full">
                <div>
                    <p class="mono-font text-[10px] font-bold tracking-[0.1em] text-purple-700 uppercase mb-1">&gt;&nbsp;EXPENDITURE</p>
                    <p class="text-[9px] md:text-[10px] text-gray-500 font-bold tracking-wider">Base BMR: <span class="text-black font-black">${bmr}</span></p>
                </div>
                <p class="text-xl md:text-2xl font-black mono-font text-black">${caloriesOut} <span class="text-[10px] md:text-xs text-gray-500">kcal</span></p>
            </div>
        `;
    }

    function loadData(date) {
        const d = storage[date] || { split: 'Chest', foods: [], sets: {}, weight: '', water: '', steps: '', junkKcal: '', junkProtein: '', cardio: {} };
        
        document.getElementById('split-selector').value = d.split || 'Chest';
        
        // Load weight from today, or carry forward from the most recent historical entry
        document.getElementById('weight-in').value = d.weight || getRecentWeight(date);
        
        document.getElementById('water-in').value = d.water || '';
        document.getElementById('steps-in').value = d.steps || '';
        document.getElementById('junk-kcal').value = d.junkKcal || '';
        document.getElementById('junk-protein').value = d.junkProtein || '';
        
        renderFoods(d.foods);
        renderExercises(); 
    }

    function switchTab(tab) {
        activeTab = tab; 
        if(tab === 'daily') {
            document.getElementById('view-daily').classList.remove('hidden');
            document.getElementById('view-analytics').classList.add('hidden');
            document.getElementById('view-analytics').classList.remove('flex');
            
            document.getElementById('btn-daily').className = 'flex-1 sm:flex-none px-4 md:px-6 py-2 text-sm font-bold border-2 border-black bg-black text-white transition-colors shadow-[2px_2px_0px_rgba(0,0,0,1)]';
            document.getElementById('btn-analytics').className = 'flex-1 sm:flex-none px-4 md:px-6 py-2 text-sm font-bold border-2 border-transparent bg-gray-200 text-gray-600 hover:text-black hover:bg-gray-300 transition-colors shadow-none';
        } else {
            document.getElementById('view-daily').classList.add('hidden');
            document.getElementById('view-analytics').classList.remove('hidden');
            document.getElementById('view-analytics').classList.add('flex');
            
            document.getElementById('btn-analytics').className = 'flex-1 sm:flex-none px-4 md:px-6 py-2 text-sm font-bold border-2 border-black bg-black text-white transition-colors shadow-[2px_2px_0px_rgba(0,0,0,1)]';
            document.getElementById('btn-daily').className = 'flex-1 sm:flex-none px-4 md:px-6 py-2 text-sm font-bold border-2 border-transparent bg-gray-200 text-gray-600 hover:text-black hover:bg-gray-300 transition-colors shadow-none';
            
            generateCharts();
        }
    }

    // Chart Generation Logic
    function generateCharts() {
        Object.values(charts).forEach(c => c.destroy());
        
        // Light Theme Chart Defaults
        Chart.defaults.color = '#4b5563'; // gray-600
        Chart.defaults.font.family = "'JetBrains Mono', monospace";
        Chart.defaults.plugins.legend.labels.usePointStyle = true;
        Chart.defaults.maintainAspectRatio = false; 

        const startInput = document.getElementById('analytics-start').value;
        const endInput = document.getElementById('analytics-end').value;
        
        if (!startInput || !endInput) return;

        const sParts = startInput.split('-');
        const eParts = endInput.split('-');
        const startDate = new Date(sParts[0], sParts[1] - 1, sParts[2]);
        const endDate = new Date(eParts[0], eParts[1] - 1, eParts[2]);

        if(startDate > endDate) {
            alert("Start date must be before end date.");
            return;
        }

        const dates = [];
        const kcalIn = [], kcalOut = [];
        const waterData = [], stepsData = [], proteinData = [];
        const energyBgIn = [], energyBgOut = [];

        for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
            const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            dates.push(`${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`); 

            const dayData = storage[dateStr] || { foods: [], sets: {}, cardio: {}, weight: '', steps: 0, water: 0, junkKcal: 0, junkProtein: 0 };
            
            let kIn = parseInt(dayData.junkKcal) || 0;
            let pIn = parseInt(dayData.junkProtein) || 0;
            if(dayData.foods) {
                dayData.foods.forEach(fId => {
                    const food = FOOD_DB.find(f => f.id === fId);
                    if(food) { kIn += food.kcal; pIn += food.p; }
                });
            }
            kcalIn.push(kIn);
            proteinData.push(pIn);

            let workoutActive = dayData.sets && Object.values(dayData.sets).some(val => val !== '');
            let cardioBurn = parseInt(dayData.cardio?.kcal) || 0;
            let stepCount = parseInt(dayData.steps) || 0;
            
            // Reconstruct historical BMR
            let dayWeight = parseFloat(dayData.weight) || parseFloat(getRecentWeight(dateStr)) || 67;
            let bmr = Math.round((10 * dayWeight) + (6.25 * USER_HEIGHT_CM) - (5 * USER_AGE) + 5);
            let kOut = Math.round(bmr + (workoutActive ? 350 : 0) + cardioBurn + (stepCount * 0.04));
            kcalOut.push(kOut);

            // Dynamic Energy Chart Colors
            if (kOut > kIn) {
                // Caloric Deficit
                energyBgIn.push('#fca5a5');  // Light Red
                energyBgOut.push('#ef4444'); // Bold Red
            } else if (kIn > kOut) {
                // Caloric Surplus
                energyBgIn.push('#22c55e');  // Bold Green
                energyBgOut.push('#86efac'); // Light Green
            } else {
                energyBgIn.push('#d1d5db');
                energyBgOut.push('#111827');
            }

            waterData.push(parseFloat(dayData.water) || 0);
            stepsData.push(stepCount);
        }

        const gridOptions = { grid: { color: '#e5e7eb' } };

        charts.energy = new Chart(document.getElementById('chart-energy'), { 
            type: 'bar', 
            data: { 
                labels: dates, 
                datasets: [
                    { label: 'Kcal In', data: kcalIn, backgroundColor: energyBgIn }, 
                    { label: 'Kcal Out', data: kcalOut, backgroundColor: energyBgOut }, 
                    { label: 'Threshold (2500)', data: Array(dates.length).fill(2500), type: 'line', borderColor: '#000000', borderDash: [5, 5], pointRadius: 0, borderWidth: 2 }
                ] 
            },
            options: { plugins: { title: { display: true, text: 'Energy Balance (Kcal)' } }, scales: { y: gridOptions, x: gridOptions } }
        });

        charts.protein = new Chart(document.getElementById('chart-protein'), { 
            type: 'line', 
            data: { labels: dates, datasets: [{ label: 'Protein (g)', data: proteinData, borderColor: '#2563eb', backgroundColor: 'rgba(37, 99, 235, 0.1)', fill: true, tension: 0.3 }, { label: 'Goal (90g)', data: Array(dates.length).fill(90), type: 'line', borderColor: '#22c55e', borderDash: [5, 5], pointRadius: 0, borderWidth: 2 }] },
            options: { plugins: { title: { display: true, text: 'Daily Protein Intake' } }, scales: { y: gridOptions, x: gridOptions } }
        });

        charts.water = new Chart(document.getElementById('chart-water'), { 
            type: 'bar', 
            data: { labels: dates, datasets: [{ label: 'Water (Liters)', data: waterData, backgroundColor: '#0ea5e9' }, { label: 'Goal (3L)', data: Array(dates.length).fill(3), type: 'line', borderColor: '#22c55e', borderDash: [5, 5], pointRadius: 0, borderWidth: 2 }] },
            options: { plugins: { title: { display: true, text: 'Hydration Tracker' } }, scales: { y: gridOptions, x: gridOptions } }
        });

        charts.steps = new Chart(document.getElementById('chart-steps'), { 
            type: 'bar', 
            data: { labels: dates, datasets: [{ label: 'Steps', data: stepsData, backgroundColor: '#f59e0b' }, { label: 'Goal (6000)', data: Array(dates.length).fill(6000), type: 'line', borderColor: '#22c55e', borderDash: [5, 5], pointRadius: 0, borderWidth: 2 }] },
            options: { plugins: { title: { display: true, text: 'Step Count' } }, scales: { y: gridOptions, x: gridOptions } }
        });

        renderWorkoutChart();
    }

    function renderWorkoutChart() {
        if(charts.workout) charts.workout.destroy();
        
        const selectedEx = document.getElementById('analytics-exercise-selector').value;
        const startInput = document.getElementById('analytics-start').value;
        const endInput = document.getElementById('analytics-end').value;
        
        if (!startInput || !endInput) return;

        const sParts = startInput.split('-');
        const eParts = endInput.split('-');
        const startDate = new Date(sParts[0], sParts[1] - 1, sParts[2]);
        const endDate = new Date(eParts[0], eParts[1] - 1, eParts[2]);

        const dates = [];
        const s1Data = [], s2Data = [], s3Data = [];

        for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
            const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            dates.push(`${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`); 

            const dayData = storage[dateStr] || { sets: {} };
            s1Data.push(parseFloat(dayData.sets[`${selectedEx}-s1`]) || null);
            s2Data.push(parseFloat(dayData.sets[`${selectedEx}-s2`]) || null);
            s3Data.push(parseFloat(dayData.sets[`${selectedEx}-s3`]) || null);
        }

        const gridOptions = { grid: { color: '#e5e7eb' } };

        charts.workout = new Chart(document.getElementById('chart-workout'), { 
            type: 'line', 
            data: { labels: dates, datasets: [{ label: 'Set 1', data: s1Data, borderColor: '#9ca3af', spanGaps: true, tension: 0.2 }, { label: 'Set 2', data: s2Data, borderColor: '#3b82f6', spanGaps: true, tension: 0.2 }, { label: 'Set 3', data: s3Data, borderColor: '#a855f7', spanGaps: true, tension: 0.2 }] },
            options: { maintainAspectRatio: false, scales: { y: gridOptions, x: gridOptions } }
        });
    }

    init();
</script>
