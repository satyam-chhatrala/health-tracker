<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Tracker - Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;700;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-deep: #050505; 
            --bg-panel: #0f0f0f; 
            --border-heavy: #222222; 
            --border-light: #e5e5e5;
            --text-main: #f5f5f5; 
            --text-muted: #888888;
            --text-accent: #6b8fd9;
        }
        
        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        .title-font { font-family: 'Outfit', sans-serif; }
        
        /* Custom Checkbox */
        .custom-chk { appearance: none; width: 20px; height: 20px; background-color: transparent; border: 2px solid white; cursor: pointer; display: grid; place-content: center; }
        .custom-chk::before { content: ""; width: 10px; height: 10px; transform: scale(0); background-color: black; clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); }
        .custom-chk:checked { background-color: white; }
        .custom-chk:checked::before { transform: scale(1); }

        ::-webkit-scrollbar { width: 6px; } 
        ::-webkit-scrollbar-thumb { background: var(--border-heavy); }
        ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

        .tab-active { border: 2px solid white; color: white; }
        .tab-inactive { color: var(--text-muted); border: 2px solid transparent; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center overflow-x-hidden">
    
    <div class="w-full max-w-[1400px]">
        <!-- HEADER -->
        <header class="flex flex-col lg:flex-row justify-between items-start lg:items-end border-b border-heavy pb-6 mb-6 md:mb-8 border-[#222] gap-6 lg:gap-0">
            <div class="w-full lg:w-auto">
                <h1 class="text-4xl md:text-5xl font-black tracking-tight mb-2 title-font bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">Health Tracker</h1>
                <p class="text-[10px] md:text-[11px] tracking-[0.2em] md:tracking-[0.3em] text-gray-400 font-bold uppercase">Body Composition & Performance Analytics</p>
            </div>
            
            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4 w-full lg:w-auto">
                <!-- Navigation Tabs -->
                <div class="flex gap-2 w-full sm:w-auto">
                    <button id="btn-daily" onclick="switchTab('daily')" class="flex-1 sm:flex-none tab-active px-4 md:px-6 py-2 text-sm font-bold bg-[#1a1a1a]">Daily Log</button>
                    <button id="btn-analytics" onclick="switchTab('analytics')" class="flex-1 sm:flex-none tab-inactive px-4 md:px-6 py-2 text-sm font-bold hover:text-white transition-colors">Analytics</button>
                </div>
                
                <input type="date" id="date-picker" style="color-scheme: dark;" class="w-full sm:w-auto bg-black border-4 border-white p-2 text-sm font-bold mono-font text-white uppercase outline-none focus:border-gray-300 cursor-pointer">
            </div>
        </header>

        <!-- MAIN CONTENT: DAILY LOG -->
        <div id="view-daily" class="flex flex-col lg:grid lg:grid-cols-12 gap-6">
            
            <!-- LEFT COLUMN (Nutrition & Hydration) -->
            <div class="lg:col-span-5 flex flex-col gap-6 w-full">
                <!-- Food List Panel -->
                <div class="border-4 border-[#222] bg-[#0a0a0a] p-4 md:p-6 h-[400px] md:h-[500px] flex flex-col">
                    <h2 class="text-base md:text-lg font-bold tracking-widest mono-font text-[#34d399] mb-4 md:mb-6 drop-shadow-[0_0_8px_rgba(52,211,153,0.4)] break-all">
                        <span class="text-[#555]">root@sys:~#</span> ./compile_nutrition.sh<span class="animate-pulse text-white">_</span>
                    </h2>
                    
                    <!-- Categorized Food List Wrapper -->
                    <div id="food-list" class="flex-col gap-2 overflow-y-auto pr-2 flex-grow relative"></div>
                </div>

                <!-- Manual Entries Grid -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
                    <div class="border-4 border-[#222] bg-[#0a0a0a] p-3 flex flex-col justify-between">
                        <p class="mono-font text-[10px] font-bold tracking-[0.1em] md:tracking-[0.2em] text-[#34d399] uppercase mb-2 drop-shadow-[0_0_5px_rgba(52,211,153,0.6)]">&gt;&nbsp;SYS.WEIGHT</p>
                        <input type="number" id="weight-in" step="0.1" placeholder="kg" class="w-full bg-black border-2 border-white text-center text-white text-lg font-black mono-font py-1 focus:outline-none focus:border-[#6b8fd9]" oninput="autoSave()">
                    </div>
                    <div class="border-4 border-[#222] bg-[#0a0a0a] p-3 flex flex-col justify-between">
                        <p class="mono-font text-[10px] font-bold tracking-[0.1em] md:tracking-[0.2em] text-[#60a5fa] uppercase mb-2 drop-shadow-[0_0_5px_rgba(96,165,250,0.6)]">&gt;&nbsp;HYDRATION</p>
                        <input type="number" id="water-in" step="0.1" placeholder="L" class="w-full bg-black border-2 border-white text-center text-white text-lg font-black mono-font py-1 focus:outline-none focus:border-[#6b8fd9]" oninput="autoSave()">
                    </div>
                    <div class="border-4 border-[#222] bg-[#0a0a0a] p-3 flex flex-col justify-between">
                        <p class="mono-font text-[10px] font-bold tracking-[0.1em] md:tracking-[0.2em] text-[#fb7185] uppercase mb-2 drop-shadow-[0_0_5px_rgba(251,113,133,0.6)]">&gt;&nbsp;ERR_KCAL</p>
                        <input type="number" id="junk-kcal" placeholder="0" class="w-full bg-black border-2 border-white text-center text-white text-lg font-black mono-font py-1 focus:outline-none focus:border-[#6b8fd9]" oninput="autoSave()">
                    </div>
                    <div class="border-4 border-[#222] bg-[#0a0a0a] p-3 flex flex-col justify-between">
                        <p class="mono-font text-[10px] font-bold tracking-[0.1em] md:tracking-[0.2em] text-[#c084fc] uppercase mb-2 drop-shadow-[0_0_5px_rgba(192,132,252,0.6)]">&gt;&nbsp;ERR_PRO</p>
                        <input type="number" id="junk-protein" placeholder="0" class="w-full bg-black border-2 border-white text-center text-white text-lg font-black mono-font py-1 focus:outline-none focus:border-[#6b8fd9]" oninput="autoSave()">
                    </div>
                </div>
                
                <!-- Left Metrics Bottom -->
                <div id="metrics-log" class="border-4 border-[#222] bg-[#0a0a0a] p-4 h-auto md:h-24"></div>
            </div>

            <!-- RIGHT COLUMN (Workout & Steps) -->
            <div class="lg:col-span-7 flex flex-col gap-6 w-full">
                <!-- Workout Panel -->
                <div class="border-4 border-[#222] bg-[#0a0a0a] p-4 md:p-8 flex flex-col min-h-[500px] md:min-h-[630px] relative">
                    
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 md:mb-8 border-b border-[#222] pb-4 md:pb-6 gap-4 sm:gap-0">
                        <h2 class="text-base md:text-lg font-bold tracking-widest mono-font text-[#6b8fd9] drop-shadow-[0_0_8px_rgba(107,143,217,0.4)] mt-1 break-all">
                            <span class="text-[#555]">root@sys:~#</span> ./exec_protocol.sh<span class="animate-pulse text-white">_</span>
                        </h2>
                        <div class="relative w-full sm:w-auto">
                            <select id="split-selector" class="w-full sm:w-auto appearance-none bg-black border-2 border-white text-white px-4 py-2 pr-10 font-mono text-sm outline-none cursor-pointer hover:bg-[#111]" onchange="renderExercises()">
                                <option value="Chest">Chest</option>
                                <option value="Abs">Abs</option>
                                <option value="Biceps">Biceps</option>
                                <option value="Triceps">Triceps</option>
                                <option value="Back">Back</option>
                                <option value="Shoulder">Shoulder</option>
                                <option value="Leg">Leg</option>
                                <option value="Cardio">Cardio</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-white">
                                <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                            </div>
                        </div>
                    </div>

                    <div id="exercise-list" class="flex flex-col gap-6 flex-grow"></div>
                </div>
                
                <!-- Bottom Row: Steps and Activity Log -->
                <div class="flex flex-col sm:flex-row gap-4 md:gap-6 w-full">
                    <div class="border-4 border-[#222] bg-[#0a0a0a] p-4 h-24 w-full sm:w-1/3 flex flex-col justify-between">
                        <p class="mono-font text-[10px] font-bold tracking-[0.2em] text-[#fbbf24] uppercase mb-1 drop-shadow-[0_0_5px_rgba(251,191,36,0.6)]">&gt;&nbsp;SYS.STEPS</p>
                        <input type="number" id="steps-in" placeholder="0" class="w-full bg-black border-2 border-white text-white text-xl font-black mono-font px-2 py-1 focus:outline-none focus:border-[#6b8fd9]" oninput="autoSave()">
                    </div>
                    <div id="activity-log" class="border-4 border-dashed border-[#222] bg-[#0a0a0a] p-4 h-24 w-full sm:w-2/3"></div>
                </div>
            </div>
        </div>

        <!-- MAIN CONTENT: ANALYTICS -->
        <div id="view-analytics" class="hidden flex-col gap-6 w-full">
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-[#0a0a0a] border-4 border-[#222] p-4 gap-4 sm:gap-0">
                <p class="text-xs tracking-widest uppercase font-bold text-gray-400">Database Status: <span id="db-status-badge" class="text-yellow-400">Loading Cloud Data...</span></p>
                <button class="w-full sm:w-auto bg-[#1a1a1a] border-2 border-white text-white text-xs font-bold uppercase tracking-wider px-4 py-2 opacity-50 cursor-not-allowed">Auto-Fetching...</button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 w-full">
                <div class="border-4 border-[#222] bg-[#0a0a0a] p-4 md:p-6 w-full"><canvas id="chart-energy"></canvas></div>
                <div class="border-4 border-[#222] bg-[#0a0a0a] p-4 md:p-6 w-full"><canvas id="chart-protein"></canvas></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 w-full">
                <div class="border-4 border-[#222] bg-[#0a0a0a] p-4 md:p-6 w-full"><canvas id="chart-water"></canvas></div>
                <div class="border-4 border-[#222] bg-[#0a0a0a] p-4 md:p-6 w-full"><canvas id="chart-steps"></canvas></div>
            </div>

            <div class="border-4 border-[#222] bg-[#0a0a0a] p-4 md:p-6 w-full">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 border-b border-[#222] pb-4 gap-4 sm:gap-0">
                    <h3 class="mono-font text-xs md:text-sm font-bold tracking-widest uppercase text-[#e5e5e5] drop-shadow-[0_0_5px_rgba(255,255,255,0.4)] break-all">&gt;&nbsp;STRENGTH_PROGRESSION_LOG</h3>
                    <select id="analytics-exercise-selector" class="w-full sm:w-auto bg-black border-2 border-white text-white px-2 py-1 font-mono text-xs outline-none" onchange="renderWorkoutChart()">
                        <!-- Options populated by JS -->
                    </select>
                </div>
                <div class="h-[250px] md:h-[300px] w-full relative"><canvas id="chart-workout"></canvas></div>
            </div>

        </div>

    </div>

<script>
    // ==========================================
    // ⚙️ BACKEND CONFIGURATION
    // ==========================================
    const API_URL = 'https://health-tracker-api-440498875126.asia-south1.run.app/api'; 
    
    let storage = {}; 
    let activeTab = 'daily';
    let charts = {};
    let syncTimeout = null; 

    // Constants for BMR Calculation
    const USER_HEIGHT_CM = 185;
    const USER_AGE = 24; 

    // Food Database with Categories
    const FOOD_DB = [
        // BREAKFAST
        { id: 'f1', name: '3 Egg Omelette', kcal: 210, p: 18, category: 'Breakfast' }, 
        { id: 'f2', name: '3 Boiled egg white', kcal: 60, p: 12, category: 'Breakfast' }, 
        { id: 'f3', name: '2 Wheat Bread Slices', kcal: 140, p: 7, category: 'Breakfast' }, 
        { id: 'f4', name: '1 Spoon Peanut Butter', kcal: 95, p: 3, category: 'Breakfast' }, 
        { id: 'f5', name: 'Any Paratha', kcal: 100, p: 4, category: 'Breakfast' }, 
        { id: 'f6', name: '2 Plain Dosa', kcal: 100, p: 6, category: 'Breakfast' }, 
        { id: 'f7', name: 'Ginger Tea - pre lunch', kcal: 60, p: 3, category: 'Breakfast' }, 

        // LUNCH
        { id: 'f8', name: '2 Roti (Lunch)', kcal: 200, p: 6, category: 'Lunch' }, 
        { id: 'f9', name: 'Paneer Curry (Lunch)', kcal: 200, p: 10, category: 'Lunch' }, 
        { id: 'f10', name: 'Dal (Lunch)', kcal: 150, p: 5, category: 'Lunch' }, 
        { id: 'f11', name: 'Greek Yogurt Cup (Lunch)', kcal: 90, p: 6, category: 'Lunch' }, 
        { id: 'f20', name: '1 cup rice', kcal: 180, p: 0, category: 'Lunch' }, 

        // SNACKS
        { id: 'f12', name: 'Ginger Tea (Snacks)', kcal: 60, p: 3, category: 'Snacks' }, 
        { id: 'f13', name: '2 Bananas (Snacks)', kcal: 180, p: 4, category: 'Snacks' }, 
        { id: 'f14', name: '30 Pista (Snacks)', kcal: 100, p: 3, category: 'Snacks' }, 

        // DINNER
        { id: 'f15', name: '2 Roti (Dinner)', kcal: 200, p: 6, category: 'Dinner' }, 
        { id: 'f16', name: 'Paneer Curry (Dinner)', kcal: 200, p: 10, category: 'Dinner' }, 
        { id: 'f17', name: 'Dal (Dinner)', kcal: 150, p: 5, category: 'Dinner' }, 
        { id: 'f18', name: 'Protein Shake', kcal: 500, p: 48, category: 'Dinner' }, 
        
        // WEEKEND ORDERS
        { id: 'f19', name: ' Thali - Matar Paneer, 3 Roti, Kali Dal', kcal: 600, p: 17, category: 'Weekend Orders' }, 
        { id: 'f21', name: 'Vada Pav', kcal: 170, p: 3, category: 'Weekend Orders' }, 
        { id: 'f22', name: 'Paneer Subz Khichadi', kcal: 685, p: 32, category: 'Weekend Orders' }, 
        { id: 'f23', name: 'Paneer Bhurji', kcal: 426, p: 21, category: 'Weekend Orders' }, 
        { id: 'f24', name: 'Paneer Lababdar', kcal: 450, p: 15, category: 'Weekend Orders' }, 
        { id: 'f25', name: '2 Whole Wheat Chapati', kcal: 200, p: 6, category: 'Weekend Orders' }, 
        { id: 'f26', name: 'Kasuri Methi Tawa Paratha', kcal: 300, p: 9, category: 'Weekend Orders' }, 
        { id: 'f27', name: 'Chhole Kulcha', kcal: 400, p: 27, category: 'Weekend Orders' }, 
        { id: 'f28', name: 'Yellow Dal Tadka', kcal: 450, p: 26, category: 'Weekend Orders' }, 
        { id: 'f29', name: 'Grilled Barbeque Chicken Rice Bowl', kcal: 650, p: 30, category: 'Weekend Orders' }, 
        { id: 'f30', name: 'Cookie Monster Sundae', kcal: 900, p: 6, category: 'Weekend Orders' }
    ];

    const WORKOUT_DB = {
        "Chest": ['Incline Bench', 'Flat Bench', 'Pec Fly', 'Push-ups', 'Low to High Cable Pull'],
        "Abs": ['Crunches', 'Leg Raises', 'Plank', 'Roller'],
        "Biceps": ['Bicep Curls', 'Hammer Curls', 'Preacher Curls'],
        "Triceps": ['Tricep Pushdowns', 'Overhead Extension', 'Dips', 'Skull Crushers'],
        "Back": ['Pull-ups', 'Barbell Rows', 'Lat Pulldown', 'Face Pulls'],
        "Shoulder": ['Overhead Press', 'Lateral Raises', 'Front Raises', 'Reverse Pec Fly', 'Military Press'],
        "Leg": ['Squats', 'Leg Press', 'Calf Raises', 'Leg Extensions', 'Hamstring Curl', 'Lunges'],
        "Cardio": [] 
    };

    // Helper: Finds the most recently entered weight before or on the current date
    function getRecentWeight(targetDate) {
        if (storage[targetDate] && storage[targetDate].weight) return storage[targetDate].weight;
        const dates = Object.keys(storage).filter(k => k < targetDate).sort().reverse();
        for (let d of dates) {
            if (storage[d].weight) return storage[d].weight;
        }
        return ''; 
    }

    // INIT: Fetches database state on load
    async function init() {
        const selector = document.getElementById('analytics-exercise-selector');
        Object.keys(WORKOUT_DB).forEach(split => {
            if(split !== 'Cardio') {
                WORKOUT_DB[split].forEach(ex => {
                    const opt = document.createElement('option');
                    opt.value = ex; opt.innerText = ex;
                    selector.appendChild(opt);
                });
            }
        });

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date-picker').value = today;
        document.getElementById('date-picker').onchange = (e) => {
            loadData(e.target.value);
            if(activeTab === 'analytics') generateCharts();
        };

        try {
            const response = await fetch(`${API_URL}/logs`);
            if (response.ok) {
                storage = await response.json();
                document.getElementById('db-status-badge').innerText = "Connected to MongoDB";
                document.getElementById('db-status-badge').className = "text-green-400";
            } else {
                throw new Error("API responded but not OK");
            }
        } catch (err) {
            console.warn("Could not reach DB API. Operating in memory-only mode.", err);
            document.getElementById('db-status-badge').innerText = "Offline (In-Memory)";
            document.getElementById('db-status-badge').className = "text-red-400";
        }

        loadData(today);
    }

    // RENDER CATEGORIZED FOODS
    function renderFoods(savedFoods = []) {
        const categories = ['Breakfast', 'Lunch', 'Snacks', 'Dinner', 'Weekend Orders'];
        let html = '';

        categories.forEach(cat => {
            const foodsInCat = FOOD_DB.filter(f => f.category === cat);
            if(foodsInCat.length === 0) return;

            html += `
                <div class="mb-5 first:mt-0">
                    <h3 class="text-[10px] font-black tracking-widest text-[#6b8fd9] uppercase sticky top-0 bg-[#0a0a0a] py-2 border-b border-[#222] z-10">${cat}</h3>
                    <div class="flex flex-col mt-2">
            `;

            html += foodsInCat.map(f => `
                <label class="flex items-center gap-4 py-2.5 border-b border-[#111] cursor-pointer hover:bg-[#111] transition-colors rounded px-2 -mx-2">
                    <input type="checkbox" id="chk-${f.id}" class="custom-chk flex-shrink-0" ${savedFoods.includes(f.id) ? 'checked' : ''} onchange="autoSave()">
                    <div class="flex-grow flex justify-between items-center text-sm">
                        <span class="font-bold text-gray-300">${f.name}</span>
                        <span class="mono-font text-xs text-[#555]">${f.kcal} <span class="text-[10px]">kcal</span> <span class="mx-1 hidden sm:inline">|</span> <span class="text-[#e5e5e5] hidden sm:inline">${f.p}g</span></span>
                    </div>
                </label>
            `).join('');

            html += `</div></div>`;
        });

        document.getElementById('food-list').innerHTML = html;
    }

    function renderExercises() {
        const split = document.getElementById('split-selector').value;
        const date = document.getElementById('date-picker').value;
        const dayData = storage[date] || { sets: {}, cardio: {} };

        if (split === 'Cardio') {
            document.getElementById('exercise-list').innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-[#222] pb-4 gap-3 sm:gap-0">
                    <span class="mono-font text-sm font-bold text-white w-full sm:w-1/4">Treadmill/Mix</span>
                    <div class="grid grid-cols-4 gap-2 w-full sm:w-3/4 sm:flex sm:justify-end">
                        <input type="number" id="cardio-incline" placeholder="Inc" class="w-full sm:w-16 h-8 bg-black border-2 border-white text-center text-white text-sm mono-font placeholder-gray-600 focus:outline-none focus:border-[#6b8fd9]" value="${dayData.cardio?.incline || ''}" oninput="autoSave()">
                        <input type="number" id="cardio-speed" placeholder="Spd" class="w-full sm:w-16 h-8 bg-black border-2 border-white text-center text-white text-sm mono-font placeholder-gray-600 focus:outline-none focus:border-[#6b8fd9]" value="${dayData.cardio?.speed || ''}" oninput="autoSave()">
                        <input type="number" id="cardio-minutes" placeholder="Mins" class="w-full sm:w-16 h-8 bg-black border-2 border-white text-center text-white text-sm mono-font placeholder-gray-600 focus:outline-none focus:border-[#6b8fd9]" value="${dayData.cardio?.minutes || ''}" oninput="autoSave()">
                        <input type="number" id="cardio-kcal" placeholder="Kcal" class="w-full sm:w-16 h-8 bg-black border-2 border-white text-center text-white text-sm mono-font placeholder-gray-600 focus:outline-none focus:border-[#6b8fd9]" value="${dayData.cardio?.kcal || ''}" oninput="autoSave()">
                    </div>
                </div>
            `;
        } else {
            const exercises = WORKOUT_DB[split];
            document.getElementById('exercise-list').innerHTML = exercises.map(ex => `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-[#222] pb-4 gap-3 sm:gap-0">
                    <span class="mono-font text-sm font-bold text-white truncate pr-2 w-full sm:w-auto">${ex}</span>
                    <div class="grid grid-cols-3 gap-2 w-full sm:w-auto sm:flex sm:gap-4">
                        <input type="text" id="${ex}-s1" placeholder="S1" class="w-full sm:w-16 h-8 bg-black border-2 border-white text-center text-white text-sm mono-font placeholder-gray-600 focus:outline-none focus:border-[#6b8fd9]" value="${dayData.sets[`${ex}-s1`] || ''}" oninput="autoSave()">
                        <input type="text" id="${ex}-s2" placeholder="S2" class="w-full sm:w-16 h-8 bg-black border-2 border-white text-center text-white text-sm mono-font placeholder-gray-600 focus:outline-none focus:border-[#6b8fd9]" value="${dayData.sets[`${ex}-s2`] || ''}" oninput="autoSave()">
                        <input type="text" id="${ex}-s3" placeholder="S3" class="w-full sm:w-16 h-8 bg-black border-2 border-white text-center text-white text-sm mono-font placeholder-gray-600 focus:outline-none focus:border-[#6b8fd9]" value="${dayData.sets[`${ex}-s3`] || ''}" oninput="autoSave()">
                    </div>
                </div>
            `).join('');
        }
        updateMetrics(); 
    }

    // AUTOSAVE: Updates local memory instantly, then triggers a debounced cloud sync
    function autoSave() {
        const date = document.getElementById('date-picker').value;
        const split = document.getElementById('split-selector').value;
        const existingData = storage[date] || { sets: {}, cardio: {} };
        
        const selectedFoods = FOOD_DB.filter(f => document.getElementById(`chk-${f.id}`)?.checked).map(f => f.id);
        const weight = document.getElementById('weight-in').value;
        const water = document.getElementById('water-in').value;
        const steps = document.getElementById('steps-in').value;
        const junkKcal = document.getElementById('junk-kcal').value;
        const junkProtein = document.getElementById('junk-protein').value;

        const sets = {};
        if (split !== 'Cardio') {
            WORKOUT_DB[split].forEach(ex => {
                sets[`${ex}-s1`] = document.getElementById(`${ex}-s1`)?.value || '';
                sets[`${ex}-s2`] = document.getElementById(`${ex}-s2`)?.value || '';
                sets[`${ex}-s3`] = document.getElementById(`${ex}-s3`)?.value || '';
            });
        }
        const updatedSets = { ...existingData.sets, ...sets };

        const cardio = {
            incline: document.getElementById('cardio-incline') ? document.getElementById('cardio-incline').value : existingData.cardio?.incline || '',
            speed: document.getElementById('cardio-speed') ? document.getElementById('cardio-speed').value : existingData.cardio?.speed || '',
            minutes: document.getElementById('cardio-minutes') ? document.getElementById('cardio-minutes').value : existingData.cardio?.minutes || '',
            kcal: document.getElementById('cardio-kcal') ? document.getElementById('cardio-kcal').value : existingData.cardio?.kcal || ''
        };

        storage[date] = { split, foods: selectedFoods, sets: updatedSets, weight, water, steps, junkKcal, junkProtein, cardio };
        updateMetrics();

        clearTimeout(syncTimeout); 
        
        const badge = document.getElementById('db-status-badge');
        if(badge) {
            badge.innerText = "Typing...";
            badge.className = "text-yellow-400";
        }

        syncTimeout = setTimeout(() => {
            synchronizeData();
        }, 1500);
    }

    // SYNC: Pushes data silently in the background
    async function synchronizeData() {
        const date = document.getElementById('date-picker').value;
        const badge = document.getElementById('db-status-badge');
        
        if(badge) {
            badge.innerText = 'Syncing to Cloud...';
            badge.className = 'text-yellow-400';
        }
        
        try {
            const response = await fetch(`${API_URL}/log`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ date: date, data: storage[date] })
            });

            if (response.ok) {
                if(badge) {
                    badge.innerText = 'All changes saved ✓';
                    badge.className = 'text-green-400';
                }
            } else {
                throw new Error('Sync returned non-200 status');
            }
        } catch (error) {
            console.error("Auto-sync failed:", error);
            if(badge) {
                badge.innerText = 'Sync Failed ❌';
                badge.className = 'text-red-500';
            }
        }
    }

    function updateMetrics() {
        const date = document.getElementById('date-picker').value;
        const currentData = storage[date] || { sets: {}, cardio: {} };

        let totalKcal = parseInt(document.getElementById('junk-kcal').value) || 0;
        let totalProtein = parseInt(document.getElementById('junk-protein').value) || 0;
        
        FOOD_DB.forEach(f => {
            if(document.getElementById(`chk-${f.id}`)?.checked) {
                totalKcal += f.kcal;
                totalProtein += f.p;
            }
        });

        document.getElementById('metrics-log').innerHTML = `
            <div class="flex flex-row justify-between items-center h-full">
                <div>
                    <p class="mono-font text-[10px] font-bold tracking-[0.1em] md:tracking-[0.2em] text-[#34d399] uppercase mb-1 drop-shadow-[0_0_5px_rgba(52,211,153,0.4)]">&gt;&nbsp;KCAL_IN</p>
                    <p class="text-xl md:text-2xl font-black mono-font text-white">${totalKcal} <span class="text-[10px] md:text-xs text-[#6b8fd9]">kcal</span></p>
                </div>
                <div class="text-right">
                    <p class="mono-font text-[10px] font-bold tracking-[0.1em] md:tracking-[0.2em] text-[#60a5fa] uppercase mb-1 drop-shadow-[0_0_5px_rgba(96,165,250,0.4)]">PRO_IN&nbsp;&lt;</p>
                    <p class="text-xl md:text-2xl font-black mono-font text-white">${totalProtein} <span class="text-[10px] md:text-xs text-[#6b8fd9]">g</span></p>
                </div>
            </div>
        `;

        let workoutActive = false;
        if(currentData.sets) workoutActive = Object.values(currentData.sets).some(val => val !== '');
        
        let cardioBurn = parseInt(currentData.cardio?.kcal) || 0;
        let stepsCount = parseInt(document.getElementById('steps-in').value) || 0;
        let stepBurn = stepsCount * 0.04; 

        // Dynamic BMR Calculation via Mifflin-St Jeor Equation
        let currentWeight = parseFloat(document.getElementById('weight-in').value);
        if (isNaN(currentWeight) || currentWeight === 0) currentWeight = 75; // Safe fallback to avoid breaking math
        
        const bmr = Math.round((10 * currentWeight) + (6.25 * USER_HEIGHT_CM) - (5 * USER_AGE) + 5);
        const caloriesOut = Math.round(bmr + (workoutActive ? 350 : 0) + cardioBurn + stepBurn);

        document.getElementById('activity-log').innerHTML = `
            <div class="flex flex-row justify-between items-center h-full">
                <div>
                    <p class="mono-font text-[10px] font-bold tracking-[0.1em] md:tracking-[0.2em] text-[#a855f7] uppercase mb-1 drop-shadow-[0_0_5px_rgba(168,85,247,0.4)]">&gt;&nbsp;EXPENDITURE</p>
                    <p class="text-[9px] md:text-[10px] text-gray-400 font-bold tracking-wider">Base BMR: <span class="text-[#6b8fd9]">${bmr}</span></p>
                </div>
                <p class="text-xl md:text-2xl font-black mono-font text-white">${caloriesOut} <span class="text-[10px] md:text-xs text-[#6b8fd9]">kcal</span></p>
            </div>
        `;
    }

    function loadData(date) {
        const d = storage[date] || { split: 'Chest', foods: [], sets: {}, weight: '', water: '', steps: '', junkKcal: '', junkProtein: '', cardio: {} };
        
        document.getElementById('split-selector').value = d.split || 'Chest';
        
        // Load weight from today, or carry forward from the most recent historical entry
        document.getElementById('weight-in').value = d.weight || getRecentWeight(date);
        
        document.getElementById('water-in').value = d.water || '';
        document.getElementById('steps-in').value = d.steps || '';
        document.getElementById('junk-kcal').value = d.junkKcal || '';
        document.getElementById('junk-protein').value = d.junkProtein || '';
        
        renderFoods(d.foods);
        renderExercises(); 
    }

    function switchTab(tab) {
        activeTab = tab; 
        if(tab === 'daily') {
            document.getElementById('view-daily').classList.remove('hidden');
            document.getElementById('view-analytics').classList.add('hidden');
            document.getElementById('view-analytics').classList.remove('flex');
            
            document.getElementById('btn-daily').className = 'flex-1 sm:flex-none tab-active px-4 md:px-6 py-2 text-sm font-bold bg-[#1a1a1a]';
            document.getElementById('btn-analytics').className = 'flex-1 sm:flex-none tab-inactive px-4 md:px-6 py-2 text-sm font-bold hover:text-white transition-colors';
        } else {
            document.getElementById('view-daily').classList.add('hidden');
            document.getElementById('view-analytics').classList.remove('hidden');
            document.getElementById('view-analytics').classList.add('flex');
            
            document.getElementById('btn-analytics').className = 'flex-1 sm:flex-none tab-active px-4 md:px-6 py-2 text-sm font-bold bg-[#1a1a1a]';
            document.getElementById('btn-daily').className = 'flex-1 sm:flex-none tab-inactive px-4 md:px-6 py-2 text-sm font-bold hover:text-white transition-colors';
            
            generateCharts();
        }
    }

    // Chart Generation Logic
    function generateCharts() {
        Object.values(charts).forEach(c => c.destroy());
        
        Chart.defaults.color = '#888888';
        Chart.defaults.font.family = "'JetBrains Mono', monospace";
        Chart.defaults.plugins.legend.labels.usePointStyle = true;
        Chart.defaults.maintainAspectRatio = false; // Important for responsive charts

        const selectedDateStr = document.getElementById('date-picker').value;
        const parts = selectedDateStr.split('-');
        const baseDate = new Date(parts[0], parts[1] - 1, parts[2]);

        const dates = [];
        const kcalIn = [], kcalOut = [];
        const waterData = [], stepsData = [], proteinData = [];

        for(let i=6; i>=0; i--) {
            const d = new Date(baseDate);
            d.setDate(d.getDate() - i);
            const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            dates.push(`${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`); 

            const dayData = storage[dateStr] || { foods: [], sets: {}, cardio: {}, weight: '', steps: 0, water: 0, junkKcal: 0, junkProtein: 0 };
            
            let kIn = parseInt(dayData.junkKcal) || 0;
            let pIn = parseInt(dayData.junkProtein) || 0;
            if(dayData.foods) {
                dayData.foods.forEach(fId => {
                    const food = FOOD_DB.find(f => f.id === fId);
                    if(food) { kIn += food.kcal; pIn += food.p; }
                });
            }
            kcalIn.push(kIn);
            proteinData.push(pIn);

            let workoutActive = dayData.sets && Object.values(dayData.sets).some(val => val !== '');
            let cardioBurn = parseInt(dayData.cardio?.kcal) || 0;
            let stepCount = parseInt(dayData.steps) || 0;
            
            // Reconstruct historical BMR
            let dayWeight = parseFloat(dayData.weight) || parseFloat(getRecentWeight(dateStr)) || 75;
            let bmr = Math.round((10 * dayWeight) + (6.25 * USER_HEIGHT_CM) - (5 * USER_AGE) + 5);
            kcalOut.push(Math.round(bmr + (workoutActive ? 350 : 0) + cardioBurn + (stepCount * 0.04)));

            waterData.push(parseFloat(dayData.water) || 0);
            stepsData.push(stepCount);
        }

        // Add container height manually via JS to canvas wrappers if they squish, but relying on relative wrapper in HTML is cleaner.
        
        charts.energy = new Chart(document.getElementById('chart-energy'), { 
            type: 'bar', 
            data: { labels: dates, datasets: [{ label: 'Kcal In', data: kcalIn, backgroundColor: '#e5e5e5' }, { label: 'Kcal Out', data: kcalOut, backgroundColor: '#333333' }, { label: 'Threshold (2500)', data: Array(7).fill(2500), type: 'line', borderColor: '#ef4444', borderDash: [5, 5], pointRadius: 0, borderWidth: 2 }] },
            options: { plugins: { title: { display: true, text: 'Energy Balance (Kcal)' } }, scales: { y: { grid: { color: '#222' } }, x: { grid: { color: '#222' } } } }
        });

        charts.protein = new Chart(document.getElementById('chart-protein'), { 
            type: 'line', 
            data: { labels: dates, datasets: [{ label: 'Protein (g)', data: proteinData, borderColor: '#6b8fd9', backgroundColor: 'rgba(107, 143, 217, 0.1)', fill: true, tension: 0.3 }, { label: 'Goal (90g)', data: Array(7).fill(90), type: 'line', borderColor: '#4ade80', borderDash: [5, 5], pointRadius: 0, borderWidth: 2 }] },
            options: { plugins: { title: { display: true, text: 'Daily Protein Intake' } }, scales: { y: { grid: { color: '#222' } }, x: { grid: { color: '#222' } } } }
        });

        charts.water = new Chart(document.getElementById('chart-water'), { 
            type: 'bar', 
            data: { labels: dates, datasets: [{ label: 'Water (Liters)', data: waterData, backgroundColor: '#38bdf8' }, { label: 'Goal (3L)', data: Array(7).fill(3), type: 'line', borderColor: '#4ade80', borderDash: [5, 5], pointRadius: 0, borderWidth: 2 }] },
            options: { plugins: { title: { display: true, text: 'Hydration Tracker' } }, scales: { y: { grid: { color: '#222' } }, x: { grid: { color: '#222' } } } }
        });

        charts.steps = new Chart(document.getElementById('chart-steps'), { 
            type: 'bar', 
            data: { labels: dates, datasets: [{ label: 'Steps', data: stepsData, backgroundColor: '#fbbf24' }, { label: 'Goal (6000)', data: Array(7).fill(6000), type: 'line', borderColor: '#4ade80', borderDash: [5, 5], pointRadius: 0, borderWidth: 2 }] },
            options: { plugins: { title: { display: true, text: 'Step Count' } }, scales: { y: { grid: { color: '#222' } }, x: { grid: { color: '#222' } } } }
        });

        renderWorkoutChart();
    }

    function renderWorkoutChart() {
        if(charts.workout) charts.workout.destroy();
        
        const selectedEx = document.getElementById('analytics-exercise-selector').value;
        const selectedDateStr = document.getElementById('date-picker').value;
        const parts = selectedDateStr.split('-');
        const baseDate = new Date(parts[0], parts[1] - 1, parts[2]);

        const dates = [];
        const s1Data = [], s2Data = [], s3Data = [];

        for(let i=13; i>=0; i--) {
            const d = new Date(baseDate);
            d.setDate(d.getDate() - i);
            const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            dates.push(`${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`); 

            const dayData = storage[dateStr] || { sets: {} };
            s1Data.push(parseFloat(dayData.sets[`${selectedEx}-s1`]) || null);
            s2Data.push(parseFloat(dayData.sets[`${selectedEx}-s2`]) || null);
            s3Data.push(parseFloat(dayData.sets[`${selectedEx}-s3`]) || null);
        }

        charts.workout = new Chart(document.getElementById('chart-workout'), { 
            type: 'line', 
            data: { labels: dates, datasets: [{ label: 'Set 1', data: s1Data, borderColor: '#e5e5e5', spanGaps: true, tension: 0.2 }, { label: 'Set 2', data: s2Data, borderColor: '#6b8fd9', spanGaps: true, tension: 0.2 }, { label: 'Set 3', data: s3Data, borderColor: '#a855f7', spanGaps: true, tension: 0.2 }] },
            options: { maintainAspectRatio: false, scales: { y: { grid: { color: '#222' } }, x: { grid: { color: '#222' } } } }
        });
    }

    init();
</script>
</body>
</html>
