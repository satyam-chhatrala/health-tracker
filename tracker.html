<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Tracker - Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;700;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-deep: #050505; 
            --bg-panel: #0f0f0f; 
            --border-heavy: #222222; 
            --border-light: #e5e5e5;
            --text-main: #f5f5f5; 
            --text-muted: #888888;
            --text-accent: #6b8fd9;
        }
        
        body { 
            background-color: var(--bg-deep); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
        }
        
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        .title-font { font-family: 'Outfit', sans-serif; }
        
        /* Custom Checkbox Styling */
        .custom-chk {
            appearance: none;
            width: 20px;
            height: 20px;
            background-color: transparent;
            border: 2px solid white;
            cursor: pointer;
            display: grid;
            place-content: center;
        }
        .custom-chk::before {
            content: "";
            width: 10px;
            height: 10px;
            transform: scale(0);
            background-color: black;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-chk:checked { background-color: white; }
        .custom-chk:checked::before { transform: scale(1); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; } 
        ::-webkit-scrollbar-thumb { background: var(--border-heavy); }
        
        .tab-active { border: 2px solid white; color: white; }
        .tab-inactive { color: var(--text-muted); border: 2px solid transparent; }
    </style>
</head>
<body class="p-8 min-h-screen flex flex-col items-center">
    
    <div class="w-full max-w-[1400px]">
        <!-- HEADER -->
        <header class="flex justify-between items-end border-b border-heavy pb-6 mb-8 border-[#222]">
            <div>
                <h1 class="text-5xl font-black tracking-tight mb-2 title-font bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">Health Tracker</h1>
                <p class="text-[11px] tracking-[0.3em] text-gray-400 font-bold uppercase">Body Composition & Performance Analytics</p>
            </div>
            
            <div class="flex items-center gap-8">
                <!-- Navigation Tabs -->
                <div class="flex gap-2">
                    <button id="btn-daily" onclick="switchTab('daily')" class="tab-active px-6 py-2 text-sm font-bold bg-[#1a1a1a]">Daily Log</button>
                    <button id="btn-analytics" onclick="switchTab('analytics')" class="tab-inactive px-6 py-2 text-sm font-bold hover:text-white transition-colors">Analytics Report</button>
                </div>
                
                <!-- Date Picker -->
                <input type="date" id="date-picker" class="bg-black border-4 border-white p-2 text-sm font-bold mono-font text-white uppercase outline-none focus:border-gray-300">
            </div>
        </header>

        <!-- MAIN CONTENT: DAILY LOG -->
        <div id="view-daily" class="grid grid-cols-12 gap-6">
            
            <!-- LEFT COLUMN (Nutrition & Hydration) -->
            <div class="col-span-4 flex flex-col gap-6">
                
                <!-- Food List Panel -->
                <div class="border-4 border-[#222] bg-[#0a0a0a] p-6 h-[500px] flex flex-col">
                    <h2 class="text-2xl font-black uppercase tracking-widest title-font bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent mb-6 drop-shadow-sm">Compiling Calories</h2>
                    <div id="food-list" class="flex-col gap-4 overflow-y-auto pr-2 flex-grow">
                        <!-- Foods populated by JS -->
                    </div>
                </div>

                <!-- Manual Entries Grid (Water, Junk Kcal, Junk Pro) -->
                <div class="grid grid-cols-3 gap-4">
                    <div class="border-4 border-[#222] bg-[#0a0a0a] p-3 flex flex-col justify-between">
                        <p class="text-[10px] font-black tracking-widest text-blue-300 opacity-80 uppercase mb-2">Water (L)</p>
                        <input type="number" id="water-in" step="0.1" placeholder="0.0" class="w-full bg-black border-2 border-white text-center text-white text-lg font-black mono-font py-1 focus:outline-none focus:border-[#6b8fd9]" oninput="autoSave()">
                    </div>
                    <div class="border-4 border-[#222] bg-[#0a0a0a] p-3 flex flex-col justify-between">
                        <p class="text-[10px] font-black tracking-widest text-rose-300 opacity-80 uppercase mb-2">Junk Kcal</p>
                        <input type="number" id="junk-kcal" placeholder="0" class="w-full bg-black border-2 border-white text-center text-white text-lg font-black mono-font py-1 focus:outline-none focus:border-[#6b8fd9]" oninput="autoSave()">
                    </div>
                    <div class="border-4 border-[#222] bg-[#0a0a0a] p-3 flex flex-col justify-between">
                        <p class="text-[10px] font-black tracking-widest text-rose-300 opacity-80 uppercase mb-2">Junk Pro</p>
                        <input type="number" id="junk-protein" placeholder="0" class="w-full bg-black border-2 border-white text-center text-white text-lg font-black mono-font py-1 focus:outline-none focus:border-[#6b8fd9]" oninput="autoSave()">
                    </div>
                </div>
                
                <!-- Left Metrics Bottom (Calories/Protein) -->
                <div id="metrics-log" class="border-4 border-[#222] bg-[#0a0a0a] p-4 h-24">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- RIGHT COLUMN (Workout & Steps) -->
            <div class="col-span-8 flex flex-col gap-6">
                <!-- Workout Panel -->
                <div class="border-4 border-[#222] bg-[#0a0a0a] p-8 flex flex-col min-h-[630px] relative">
                    
                    <!-- Workout Header -->
                    <div class="flex justify-between items-start mb-12">
                        <h2 class="text-2xl font-black uppercase tracking-widest title-font bg-gradient-to-r from-[#6b8fd9] to-purple-400 bg-clip-text text-transparent mt-1 drop-shadow-sm">Building muscles ...... Testing Strength</h2>
                        
                        <!-- Dropdown -->
                        <div class="relative">
                            <select id="split-selector" class="appearance-none bg-black border-2 border-white text-white px-4 py-2 pr-10 font-mono text-sm outline-none cursor-pointer" onchange="renderExercises()">
                                <option value="Chest">Chest</option>
                                <option value="Abs">Abs</option>
                                <option value="Biceps">Biceps</option>
                                <option value="Triceps">Triceps</option>
                                <option value="Back">Back</option>
                                <option value="Shoulder">Shoulder</option>
                                <option value="Leg">Leg</option>
                                <option value="Cardio">Cardio</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-white">
                                <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                            </div>
                        </div>
                    </div>

                    <!-- Exercises List -->
                    <div id="exercise-list" class="flex flex-col gap-6 flex-grow">
                        <!-- Exercises populated by JS -->
                    </div>

                    <!-- Sync Button -->
                    <button onclick="synchronizeData()" class="w-full bg-[#e5e5e5] text-black font-black uppercase tracking-[0.2em] py-4 mt-8 hover:bg-white transition-colors">
                        Synchronize Data
                    </button>
                </div>
                
                <!-- Bottom Row: Steps and Activity Log -->
                <div class="flex gap-6">
                    <!-- Steps -->
                    <div class="border-4 border-[#222] bg-[#0a0a0a] p-4 h-24 w-1/3 flex flex-col justify-between">
                        <p class="text-[9px] font-mono tracking-widest text-[#6b8fd9] uppercase mb-1">STEPS_COUNT</p>
                        <input type="number" id="steps-in" placeholder="0" class="w-full bg-black border-2 border-white text-white text-xl font-black mono-font px-2 py-1 focus:outline-none focus:border-[#6b8fd9]" oninput="autoSave()">
                    </div>
                    
                    <!-- Right Activity Bottom (Calories Burnt) -->
                    <div id="activity-log" class="border-4 border-dashed border-[#222] bg-[#0a0a0a] p-4 h-24 w-2/3">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- MAIN CONTENT: ANALYTICS -->
        <div id="view-analytics" class="hidden grid-cols-2 gap-6 mt-8">
            <div class="border-4 border-[#222] bg-[#0a0a0a] p-6"><canvas id="chart1"></canvas></div>
            <div class="border-4 border-[#222] bg-[#0a0a0a] p-6"><canvas id="chart2"></canvas></div>
        </div>

    </div>

<script>
    // Merged Food Database
    const FOOD_DB = [
        { id: 'f1', name: '3 Egg Omelette', kcal: 210, p: 18 },
        { id: 'f2', name: '3 Boiled egg white', kcal: 60, p: 12 },
        { id: 'f3', name: '2 Wheat Bread Slices', kcal: 140, p: 7 },
        { id: 'f4', name: '1 Spoon Peanut Butter', kcal: 95, p: 3 },
        { id: 'f5', name: 'Any Paratha', kcal: 100, p: 4 },
        { id: 'f6', name: '2 Plain Dosa', kcal: 100, p: 6 },
        { id: 'f7', name: 'Ginger Tea - pre lunch', kcal: 60, p: 3 },
        { id: 'f8', name: '2 Roti (Lunch)', kcal: 200, p: 6 },
        { id: 'f9', name: 'Paneer Curry (Lunch)', kcal: 200, p: 10 },
        { id: 'f10', name: 'Dal (Lunch)', kcal: 150, p: 5 },
        { id: 'f11', name: 'Greek Yogurt Cup (Lunch)', kcal: 90, p: 6 },
        { id: 'f12', name: 'Ginger Tea (Snacks)', kcal: 60, p: 3 },
        { id: 'f13', name: '2 Bananas (Snacks)', kcal: 180, p: 4 },
        { id: 'f14', name: '30 Pista (Snacks)', kcal: 100, p: 3 },
        { id: 'f15', name: '2 Roti (Dinner)', kcal: 200, p: 6 },
        { id: 'f16', name: 'Paneer Curry (Dinner)', kcal: 200, p: 10 },
        { id: 'f17', name: 'Dal (Dinner)', kcal: 150, p: 5 },
        { id: 'f18', name: 'Night Shake (1.5 Scoop)', kcal: 500, p: 48 },
        { id: 'f19', name: ' Thali - Matar Paneer, 3 Roti, Kali Dal', kcal: 600, p: 17 },
        { id: 'f20', name: '1 cup rice', kcal: 180, p: 0 },
        { id: 'f21', name: 'Vada Pav', kcal: 170, p: 3 },
        { id: 'f22', name: 'Paneer Subz Khichadi', kcal: 685, p: 32 },
        { id: 'f23', name: 'Paneer Bhurji', kcal: 426, p: 21 },
        { id: 'f24', name: 'Paneer Lababdar', kcal: 450, p: 15 },
        { id: 'f25', name: '2 Whole Wheat Chapati', kcal: 200, p: 6 },
        { id: 'f26', name: 'Kasuri Methi Tawa Paratha', kcal: 300, p: 9 },
        { id: 'f27', name: 'Chhole Kulcha', kcal: 400, p: 27 },
        { id: 'f28', name: 'Yellow Dal Tadka', kcal: 450, p: 26 },
        { id: 'f29', name: 'Grilled Barbeque Chicken Rice Bowl', kcal: 650, p: 30 },
        { id: 'f30', name: 'Cookie Monster Sundae', kcal: 900, p: 6 },
    ];

    // Restructured Workout Splits
    const WORKOUT_DB = {
        "Chest": ['Incline Bench', 'Flat Bench', 'Pec Fly', 'Push-ups', 'Low to High Cable Pull'],
        "Abs": ['Crunches', 'Leg Raises', 'Plank', 'Roller'],
        "Biceps": ['Bicep Curls', 'Hammer Curls', 'Preacher Curls'],
        "Triceps": ['Tricep Pushdowns', 'Overhead Extension', 'Dips', 'Skull Crushers'],
        "Back": ['Pull-ups', 'Barbell Rows', 'Lat Pulldown', 'Face Pulls'],
        "Shoulder": ['Overhead Press', 'Lateral Raises', 'Front Raises', 'Reverse Pec Fly', 'Military Press'],
        "Leg": ['Squats', 'Leg Press', 'Calf Raises', 'Leg Extensions', 'Hamstring Curl', 'Lunges'],
        "Cardio": [] 
    };

    let storage = JSON.parse(localStorage.getItem('ht_v15')) || {};
    let activeTab = 'daily';
    let chart1Inst = null;
    let chart2Inst = null;

    function init() {
        document.getElementById('date-picker').value = '2026-06-06';
        document.getElementById('date-picker').onchange = (e) => loadData(e.target.value);
        loadData('2026-06-06');
    }

    function renderFoods(savedFoods = []) {
        document.getElementById('food-list').innerHTML = FOOD_DB.map(f => `
            <label class="flex items-center gap-4 py-3 border-b border-[#222] cursor-pointer hover:bg-[#111] transition-colors">
                <input type="checkbox" id="chk-${f.id}" class="custom-chk flex-shrink-0" ${savedFoods.includes(f.id) ? 'checked' : ''} onchange="autoSave()">
                <div class="flex-grow flex justify-between items-center text-sm">
                    <span class="font-bold text-gray-200">${f.name}</span>
                    <span class="mono-font text-[#6b8fd9]">${f.kcal} kcal <span class="text-[#555] mx-1">|</span> <span class="text-[#e5e5e5]">${f.p}g P</span></span>
                </div>
            </label>
        `).join('');
    }

    function renderExercises() {
        const split = document.getElementById('split-selector').value;
        const date = document.getElementById('date-picker').value;
        const dayData = storage[date] || { sets: {}, cardio: {} };

        if (split === 'Cardio') {
            document.getElementById('exercise-list').innerHTML = `
                <div class="flex justify-between items-center border-b border-[#222] pb-4">
                    <span class="mono-font text-sm font-bold text-white w-1/4">Treadmill/Mix</span>
                    <div class="flex gap-2 w-3/4 justify-end">
                        <input type="number" id="cardio-incline" placeholder="Inc" class="w-16 h-8 bg-black border-2 border-white text-center text-white text-sm mono-font placeholder-gray-600 focus:outline-none focus:border-[#6b8fd9]" value="${dayData.cardio?.incline || ''}" oninput="autoSave()">
                        <input type="number" id="cardio-speed" placeholder="Spd" class="w-16 h-8 bg-black border-2 border-white text-center text-white text-sm mono-font placeholder-gray-600 focus:outline-none focus:border-[#6b8fd9]" value="${dayData.cardio?.speed || ''}" oninput="autoSave()">
                        <input type="number" id="cardio-minutes" placeholder="Mins" class="w-16 h-8 bg-black border-2 border-white text-center text-white text-sm mono-font placeholder-gray-600 focus:outline-none focus:border-[#6b8fd9]" value="${dayData.cardio?.minutes || ''}" oninput="autoSave()">
                        <input type="number" id="cardio-kcal" placeholder="Kcal" class="w-16 h-8 bg-black border-2 border-white text-center text-white text-sm mono-font placeholder-gray-600 focus:outline-none focus:border-[#6b8fd9]" value="${dayData.cardio?.kcal || ''}" oninput="autoSave()">
                    </div>
                </div>
            `;
        } else {
            const exercises = WORKOUT_DB[split];
            document.getElementById('exercise-list').innerHTML = exercises.map(ex => `
                <div class="flex justify-between items-center border-b border-[#222] pb-4">
                    <span class="mono-font text-sm font-bold text-white truncate pr-2">${ex}</span>
                    <div class="flex gap-4">
                        <input type="text" id="${ex}-s1" placeholder="S1" class="w-16 h-8 bg-black border-2 border-white text-center text-white text-sm mono-font placeholder-gray-600 focus:outline-none focus:border-[#6b8fd9]" value="${dayData.sets[`${ex}-s1`] || ''}" oninput="autoSave()">
                        <input type="text" id="${ex}-s2" placeholder="S2" class="w-16 h-8 bg-black border-2 border-white text-center text-white text-sm mono-font placeholder-gray-600 focus:outline-none focus:border-[#6b8fd9]" value="${dayData.sets[`${ex}-s2`] || ''}" oninput="autoSave()">
                        <input type="text" id="${ex}-s3" placeholder="S3" class="w-16 h-8 bg-black border-2 border-white text-center text-white text-sm mono-font placeholder-gray-600 focus:outline-none focus:border-[#6b8fd9]" value="${dayData.sets[`${ex}-s3`] || ''}" oninput="autoSave()">
                    </div>
                </div>
            `).join('');
        }
        
        updateMetrics(); 
    }

    function autoSave() {
        const date = document.getElementById('date-picker').value;
        const split = document.getElementById('split-selector').value;
        const existingData = storage[date] || { sets: {}, cardio: {} };
        
        // Save Foods
        const selectedFoods = FOOD_DB.filter(f => document.getElementById(`chk-${f.id}`)?.checked).map(f => f.id);
        
        // Save Quick Entries
        const water = document.getElementById('water-in').value;
        const steps = document.getElementById('steps-in').value;
        const junkKcal = document.getElementById('junk-kcal').value;
        const junkProtein = document.getElementById('junk-protein').value;

        // Save Strength Sets
        const sets = {};
        if (split !== 'Cardio') {
            WORKOUT_DB[split].forEach(ex => {
                sets[`${ex}-s1`] = document.getElementById(`${ex}-s1`)?.value || '';
                sets[`${ex}-s2`] = document.getElementById(`${ex}-s2`)?.value || '';
                sets[`${ex}-s3`] = document.getElementById(`${ex}-s3`)?.value || '';
            });
        }
        const updatedSets = { ...existingData.sets, ...sets };

        // Save Cardio Data
        const cardio = {
            incline: document.getElementById('cardio-incline') ? document.getElementById('cardio-incline').value : existingData.cardio?.incline || '',
            speed: document.getElementById('cardio-speed') ? document.getElementById('cardio-speed').value : existingData.cardio?.speed || '',
            minutes: document.getElementById('cardio-minutes') ? document.getElementById('cardio-minutes').value : existingData.cardio?.minutes || '',
            kcal: document.getElementById('cardio-kcal') ? document.getElementById('cardio-kcal').value : existingData.cardio?.kcal || ''
        };

        storage[date] = { split, foods: selectedFoods, sets: updatedSets, water, steps, junkKcal, junkProtein, cardio };
        localStorage.setItem('ht_v15', JSON.stringify(storage));
        
        updateMetrics();
    }

    function updateMetrics() {
        const date = document.getElementById('date-picker').value;
        const currentData = storage[date] || { sets: {}, cardio: {} };

        // Base intake from manual junk fields
        let totalKcal = parseInt(document.getElementById('junk-kcal').value) || 0;
        let totalProtein = parseInt(document.getElementById('junk-protein').value) || 0;
        
        // Calculate Checklist Intake
        FOOD_DB.forEach(f => {
            if(document.getElementById(`chk-${f.id}`)?.checked) {
                totalKcal += f.kcal;
                totalProtein += f.p;
            }
        });

        // Render Left Metrics Log (Intake)
        document.getElementById('metrics-log').innerHTML = `
            <div class="flex justify-between items-center h-full">
                <div>
                    <p class="text-[10px] font-black tracking-widest text-[#555] uppercase mb-1">Calories In</p>
                    <p class="text-2xl font-black mono-font text-white">${totalKcal} <span class="text-xs text-[#6b8fd9]">kcal</span></p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] font-black tracking-widest text-[#555] uppercase mb-1">Protein In</p>
                    <p class="text-2xl font-black mono-font text-white">${totalProtein} <span class="text-xs text-[#6b8fd9]">g</span></p>
                </div>
            </div>
        `;

        // Check if lifting workout is active (any set has a value saved in storage)
        let workoutActive = Object.values(currentData.sets).some(val => val !== '');
        
        // Pull active cardio burn
        let cardioBurn = parseInt(currentData.cardio?.kcal) || 0;

        // Calculate Burn (Base + Active Lifting + Active Cardio)
        const caloriesOut = 1658 + (workoutActive ? 350 : 0) + cardioBurn;

        // Render Right Activity Log (Burn)
        document.getElementById('activity-log').innerHTML = `
            <div class="flex justify-between items-center h-full">
                <div>
                    <p class="text-[9px] font-mono tracking-widest text-[#555] uppercase mb-1">ENERGY_EXPENDITURE</p>
                    <p class="text-xs text-gray-400 font-bold tracking-wider">Calories Burnt</p>
                </div>
                <p class="text-2xl font-black mono-font text-white">${caloriesOut} <span class="text-xs text-[#6b8fd9]">kcal</span></p>
            </div>
        `;
    }

    function synchronizeData() {
        autoSave();
        const btn = document.querySelector('button[onclick="synchronizeData()"]');
        btn.innerText = 'DATA SYNCHRONIZED ✓';
        btn.classList.add('bg-white', 'text-black');
        setTimeout(() => {
            btn.innerText = 'SYNCHRONIZE DATA';
            btn.classList.remove('bg-white');
        }, 2000);
    }

    function loadData(date) {
        const d = storage[date] || { split: 'Chest', foods: [], sets: {}, water: '', steps: '', junkKcal: '', junkProtein: '', cardio: {} };
        document.getElementById('split-selector').value = d.split || 'Chest';
        document.getElementById('water-in').value = d.water || '';
        document.getElementById('steps-in').value = d.steps || '';
        document.getElementById('junk-kcal').value = d.junkKcal || '';
        document.getElementById('junk-protein').value = d.junkProtein || '';
        
        renderFoods(d.foods);
        renderExercises(); 
    }

    function switchTab(tab) {
        if(tab === 'daily') {
            document.getElementById('view-daily').classList.remove('hidden');
            document.getElementById('view-analytics').classList.add('hidden');
            document.getElementById('view-analytics').classList.remove('grid');
            
            document.getElementById('btn-daily').className = 'tab-active px-6 py-2 text-sm font-bold bg-[#1a1a1a]';
            document.getElementById('btn-analytics').className = 'tab-inactive px-6 py-2 text-sm font-bold hover:text-white transition-colors';
        } else {
            document.getElementById('view-daily').classList.add('hidden');
            document.getElementById('view-analytics').classList.remove('hidden');
            document.getElementById('view-analytics').classList.add('grid');
            
            document.getElementById('btn-analytics').className = 'tab-active px-6 py-2 text-sm font-bold bg-[#1a1a1a]';
            document.getElementById('btn-daily').className = 'tab-inactive px-6 py-2 text-sm font-bold hover:text-white transition-colors';
            
            generateCharts();
        }
    }

    function generateCharts() {
        if(chart1Inst) chart1Inst.destroy();
        if(chart2Inst) chart2Inst.destroy();
        
        Chart.defaults.color = '#888888';
        Chart.defaults.font.family = "'JetBrains Mono', monospace";

        chart1Inst = new Chart(document.getElementById('chart1'), { 
            type: 'bar', 
            data: { 
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], 
                datasets: [
                    { label: 'Kcal Consumed', data: [2100, 2400, 1950, 2600, 2200, 3100, 2000], backgroundColor: '#e5e5e5' },
                    { label: 'Kcal Burned', data: [2500, 2500, 2100, 2800, 2500, 2900, 2100], backgroundColor: '#333333' }
                ] 
            },
            options: { plugins: { title: { display: true, text: 'Energy Balance (Last 7 Days)' } }, scales: { y: { grid: { color: '#222' } }, x: { grid: { color: '#222' } } } }
        });

        chart2Inst = new Chart(document.getElementById('chart2'), { 
            type: 'line', 
            data: { 
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], 
                datasets: [{ label: 'Workout Volume (kg)', data: [4500, 0, 5200, 0, 4800, 3000, 0], borderColor: '#6b8fd9', backgroundColor: 'rgba(107, 143, 217, 0.1)', fill: true, tension: 0.2 }] 
            },
            options: { plugins: { title: { display: true, text: 'Lifting Volume Trend' } }, scales: { y: { grid: { color: '#222' } }, x: { grid: { color: '#222' } } } }
        });
    }

    init();
</script>
</body>
</html>
